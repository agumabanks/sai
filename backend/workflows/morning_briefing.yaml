name: morning_briefing
version: "1.0.0"
description: "Delivers a morning briefing (8 AM EAT / 5 AM UTC) summarizing server health, alerts, schedules, and finances."
triggers:
  - type: cron
    schedule: "0 5 * * *"

steps:
  - id: get_health
    action: skill
    description: "Get server health snapshot"
    params:
      skill: server_health
      args:
        metric: all

  - id: get_alerts
    action: skill
    description: "Get recent critical alerts"
    params:
      skill: app_monitor
      args:
        severity: critical
        hours: 12

  - id: get_finance
    action: skill
    description: "Get daily finance summary"
    params:
      skill: finance_monitor
      args:
        action: daily_summary

  - id: get_ssl
    action: skill
    description: "Check SSL certs"
    params:
      skill: ssl_monitor
      args:
        action: list_expiring

  - id: get_soko
    action: skill
    description: "Soko marketplace pulse — revenue and action queue"
    params:
      skill: soko_agent
      args:
        action: pulse
        limit: 8

  - id: summarize
    action: llm
    description: "Synthesize the morning briefing"
    params:
      prompt: |
        You are Sanaa AI reporting the Morning Briefing for the admin (Banks). 
        Format this nicely with emojis. Make it readable for WhatsApp.
        
        Server Health:
        {{ steps.get_health.output }}
        
        Recent Alerts (Overnight):
        {{ steps.get_alerts.output }}
        
        Finance Summary:
        {{ steps.get_finance.output }}
        
        SSL Status:
        {{ steps.get_ssl.output }}

        Soko 24 Marketplace:
        {{ steps.get_soko.output }}
      complexity: medium
    depends_on: [get_health, get_alerts, get_finance, get_ssl, get_soko]

  - id: notify_admin
    action: notify
    description: "Send morning briefing via WhatsApp and Email"
    params:
      channel: whatsapp
      message: "{{ steps.summarize.output }}"
    depends_on: [summarize]
