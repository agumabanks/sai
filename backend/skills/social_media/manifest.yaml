name: social_media
version: "1.0.0"
description: >
  Social media content management skill. Generate platform-specific content
  for Twitter/X, LinkedIn, and Facebook. Schedule posts for future publishing.
  Summarize engagement analytics from configured social accounts.
permissions: [network]
requires_approval: false
timeout: 60
tags: [social-media, marketing, content, scheduling, analytics]
category: marketing
handler: handler
parameters:
  - name: action
    type: string
    description: >
      Action to perform: create_content (generate platform-specific content),
      schedule_post (schedule content for future publishing),
      analytics_summary (summarize engagement metrics).
    required: true
    enum: [create_content, schedule_post, analytics_summary]
  - name: topic
    type: string
    description: "Topic or subject for content creation (required for create_content)."
    required: false
  - name: platform
    type: string
    description: "Target platform: twitter, linkedin, facebook (required for create_content and schedule_post)."
    required: false
    enum: [twitter, linkedin, facebook]
  - name: content
    type: string
    description: "Content text for scheduling (required for schedule_post)."
    required: false
  - name: scheduled_time
    type: string
    description: "ISO 8601 datetime for scheduled publishing (required for schedule_post)."
    required: false
