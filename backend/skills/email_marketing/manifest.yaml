name: email_marketing
version: "1.0.0"
description: >
  Email marketing campaign management skill. Create campaigns with subject,
  body template, and recipient segments. Queue emails for delivery via SMTP.
  List active/completed campaigns. Define reusable audience segments by criteria.
  Supports template variables ({{name}}, {{company}}) in email body.
permissions: [network]
requires_approval: false
timeout: 120
tags: [email, marketing, campaigns, newsletters, audience]
category: marketing
handler: handler
parameters:
  - name: action
    type: string
    description: >
      Action to perform: create_campaign (create new campaign),
      send_campaign (queue emails for delivery via SMTP),
      list_campaigns (list campaigns by status),
      audience_segment (define audience segments).
    required: true
    enum: [create_campaign, send_campaign, list_campaigns, audience_segment]
  - name: name
    type: string
    description: "Campaign or segment name (required for create_campaign, audience_segment)."
    required: false
  - name: subject
    type: string
    description: "Email subject line (required for create_campaign)."
    required: false
  - name: body_template
    type: string
    description: "Email body template with optional {{name}}, {{company}} variables (required for create_campaign). Can be auto-generated by LLM if 'topic' is provided instead."
    required: false
  - name: topic
    type: string
    description: "Topic for LLM-generated email copy (optional for create_campaign, used when body_template is not provided)."
    required: false
  - name: segment
    type: string
    description: "Audience segment name to target (optional for create_campaign, required for send_campaign)."
    required: false
  - name: campaign_id
    type: integer
    description: "Campaign ID (required for send_campaign)."
    required: false
  - name: status_filter
    type: string
    description: "Filter campaigns by status (optional for list_campaigns)."
    required: false
    enum: [draft, sending, sent, failed, all]
  - name: criteria
    type: object
    description: "Segment criteria as key-value filters (required for audience_segment action)."
    required: false
  - name: description
    type: string
    description: "Description for the audience segment (optional for audience_segment)."
    required: false
