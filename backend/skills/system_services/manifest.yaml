name: system_services
version: "1.0.0"
description: Check systemd services, Celery beat/worker status, and process list.
permissions: [shell]
requires_approval: false
timeout: 30
tags: [infrastructure, celery, services]
handler: handler
parameters:
  - name: action
    type: string
    description: Action to perform (service_status, celery_status, recent_tasks)
    required: true
    enum: [service_status, celery_status, recent_tasks]
  - name: service_name
    type: string
    description: Name of the service (required for service_status)
    required: false
